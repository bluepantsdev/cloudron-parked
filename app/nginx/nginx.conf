# ──────────────────────────────────────────────────────────────────────────────
# nginx.conf — Base nginx configuration for the Parking app
#
# Design goals:
#   • Minimal memory footprint  (static serving only, no upstreams)
#   • Single worker process     (Cloudron containers typically get 1 CPU)
#   • Small worker_connections  (parking pages have negligible concurrency)
#   • Per-domain server blocks  (included from /tmp/parking/vhosts/*.conf)
#
# Per-domain vhosts are generated at container startup by:
#   /app/pkg/scripts/generate-vhosts.sh
#
# They live in /tmp/parking/vhosts/ which is ephemeral — wiped on restart and
# always regenerated from /app/data/domains.json + Cloudron env vars.
# ──────────────────────────────────────────────────────────────────────────────

user www-data;

# "auto" uses the number of available CPU cores.
# On a small container this will typically resolve to 1.
worker_processes auto;

pid /run/nginx/nginx.pid;

error_log /dev/stderr warn;

events {
    # Keep this low — we are serving ultra-light static pages.
    worker_connections 128;
    multi_accept off;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Log to stdout/stderr so Cloudron's log viewer picks them up
    access_log /dev/stdout;

    # ── Temporary directories (use writable /tmp/parking/) ───────────────────
    # Cloudron mounts /var as read-only, so we must use /tmp for all temp files
    client_body_temp_path /tmp/parking/client_body;
    fastcgi_temp_path /tmp/parking/fastcgi_temp;
    proxy_temp_path /tmp/parking/proxy_temp;
    scgi_temp_path /tmp/parking/scgi_temp;
    uwsgi_temp_path /tmp/parking/uwsgi_temp;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 30;

    # Never expose the nginx version in Server headers
    server_tokens off;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   4;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        text/xml
        application/xml
        image/svg+xml;

    # ── Per-domain server blocks ───────────────────────────────────────────────
    # These .conf files are generated at startup by generate-vhosts.sh.
    # Each file defines one `server {}` block for one parked domain.
    include /tmp/parking/vhosts/*.conf;
}
