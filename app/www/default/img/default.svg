<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 120 120"
     width="120" height="120"
     role="img"
     aria-label="Parked">
  <title>Parked</title>

  <!-- Blue circle -->
  <circle cx="60" cy="60" r="58" fill="#4361ee"/>

  <defs>
    <!-- Arc path tracing inside top of circle, radius 44 -->
    <path id="topArc" d="M 18,60 A 42,42 0 1,1 102,60"/>
    <path id="bottomRightArc" d="M 60,112 A 52,52 0 0,0 112,60"/>
  </defs>

  <!-- "PARKED" curved along inside top -->
  <text font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="bold"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="2.5">
    <textPath href="#topArc" startOffset="50%">PARKED</textPath>
  </text>

  <!-- White "P" prominent, nudged down slightly to balance with text -->
  <text x="60" y="68"
        font-family="Arial, Helvetica, sans-serif"
        font-size="99"
        font-weight="bold"
        fill="#ffffff"
        text-anchor="middle"
        dominant-baseline="central">P</text>

  <!-- "bluepants.dev" at 4:30 position, half size of PARKED -->
  <text font-family="Arial, Helvetica, sans-serif"
        font-size="8.5"
        font-weight="bold"
        fill="#ffffff"
        text-anchor="middle"
        letter-spacing="0.5">
    <textPath href="#bottomRightArc" startOffset="50%">bluepants.dev</textPath>
  </text>
</svg>
