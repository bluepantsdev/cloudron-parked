<!DOCTYPE html>
<!--
  onthefly.html — Dynamic parking page for domains not pre-generated
  ─────────────────────────────────────────────────────────────────────────────
  This page is served when a domain points to the app but wasn't pre-configured
  in CLOUDRON_APP_ALIASES. It uses JavaScript to read the hostname and display
  the appropriate title/blurb based on /app/data/domains.json.

  Design: Matches template.html exactly but uses client-side substitution.
  ─────────────────────────────────────────────────────────────────────────────
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Page title shown in browser tab / bookmarks -->
  <title id="page-title">Loading...</title>

  <!-- Discourage search-engine indexing of parked domains -->
  <meta name="robots" content="noindex, nofollow">

  <style>
    /* ── Reset ──────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Base ───────────────────────────────────────────────────────────── */
    html {
      /* Use system UI fonts — zero download cost */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, sans-serif;
      font-size: 18px;
      line-height: 1.6;
      color: #1a1a2e;
      background: #cacaca;
    }

    body {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* ── Card container ─────────────────────────────────────────────────── */
    .card {
      background: #ffffff;
      border-radius: 1rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      padding: 3rem 2.5rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }

    /* ── Domain logo / image ────────────────────────────────────────────── */
    .card__image {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin: 0 auto 1.5rem;
      display: block;
      /* Soft fade-in — no JS required */
      animation: fadein 0.4s ease;
    }

    /* ── Domain name heading ─────────────────────────────────────────────── */
    .card__title {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0f3460;
      margin-bottom: 0.75rem;
      word-break: break-all; /* prevent overflow on long domains */
    }

    /* ── Divider ────────────────────────────────────────────────────────── */
    .card__divider {
      width: 3rem;
      height: 3px;
      background: linear-gradient(90deg, #4361ee, #7209b7);
      border: none;
      border-radius: 2px;
      margin: 0.75rem auto 1.25rem;
    }

    /* ── "Parked" badge ─────────────────────────────────────────────────── */
    .card__badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #4361ee;
      background: #eef0fd;
      border-radius: 99px;
      padding: 0.25em 0.9em;
      margin-bottom: 1.25rem;
    }

    /* ── Redirect notice ────────────────────────────────────────────────── */
    .card__redirect {
      font-size: 0.85rem;
      color: #666;
      background: #f8f9fa;
      border-left: 3px solid #4361ee;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      border-radius: 4px;
    }
    .card__redirect strong {
      color: #4361ee;
      font-weight: 600;
    }

    /* ── Blurb paragraph ────────────────────────────────────────────────── */
    .card__blurb {
      font-size: 0.95rem;
      color: #555;
      line-height: 1.7;
    }

    /* ── Footer ─────────────────────────────────────────────────────────── */
    .card__footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #aaa;
    }

    /* ── Animation ──────────────────────────────────────────────────────── */
    @keyframes fadein {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Reduced-motion ─────────────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      .card__image { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">

    <!-- Domain logo / custom image -->
    <img
      class="card__image"
      id="domain-image"
      src="/img/default.svg"
      alt="Domain logo"
      width="120"
      height="120"
      loading="eager"
      onerror="this.src='/img/default.svg'; this.onerror=null;"
    >

    <!-- Domain name -->
    <h1 class="card__title" id="domain-title">Loading...</h1>

    <hr class="card__divider" aria-hidden="true">

    <!-- Status badge -->
    <span class="card__badge">Domain Parked</span>

    <!-- Redirect notice (shown if arriving from another domain) -->
    <div id="redirect-notice" class="card__redirect" style="display: none;">
      <small>↪ Redirected from <strong id="redirect-from"></strong></small>
    </div>

    <!-- Per-domain blurb (set in /app/data/domains.json) -->
    <p class="card__blurb" id="domain-blurb">This domain is parked for future use.</p>

    <footer class="card__footer">
      <small>Powered by <a href="https://korpit.net" rel="noopener">korpit.net</a></small>
      <small style="display: block; margin-top: 0.5rem; color: #999;" id="version">v?.?.?</small>
    </footer>

  </main>

  <script>
    // Initialize page with current hostname
    (function() {
      var currentHost = window.location.hostname;
      var defaultBlurb = "This domain is parked for future use.";
      
      // Set default values immediately
      document.getElementById('page-title').textContent = currentHost;
      document.getElementById('domain-title').textContent = currentHost;
      document.getElementById('domain-blurb').textContent = defaultBlurb;
      
      var imageEl = document.getElementById('domain-image');
      imageEl.alt = currentHost + ' logo';
      
      // Try domain-specific image first
      var imageSrc = '/img/' + currentHost + '.png';
      imageEl.src = imageSrc;
      
      // Attempt to load domains.json config to get custom title/blurb
      // Note: This won't work if nginx doesn't serve JSON files, so we keep defaults
      fetch('/config.json')
        .then(function(response) {
          if (response.ok) {
            return response.json();
          }
          throw new Error('Config not available');
        })
        .then(function(config) {
          var domainConfig = config.domains && config.domains[currentHost];
          var defaults = config._defaults || {};
          
          if (domainConfig) {
            var title = domainConfig.title || defaults.title || currentHost;
            var blurb = domainConfig.blurb || defaults.blurb || defaultBlurb;
            var image = domainConfig.image || defaults.image;
            
            document.getElementById('page-title').textContent = title;
            document.getElementById('domain-title').textContent = title;
            document.getElementById('domain-blurb').textContent = blurb;
            
            if (image) {
              imageEl.src = image;
            }
          }
          
          if (config.version) {
            document.getElementById('version').textContent = 'v' + config.version;
          }
        })
        .catch(function(err) {
          // Config not available - keep defaults
          console.log('Using default configuration');
        });
      
      // Detect if user arrived via redirect and show source domain
      var referrerHost = '';
      var fromDomain = '';

      // Check URL parameter first (e.g., ?from=example.com)
      var urlParams = new URLSearchParams(window.location.search);
      var fromParam = urlParams.get('from');
      
      if (fromParam) {
        fromDomain = fromParam;
      } 
      // Fall back to document.referrer
      else if (document.referrer) {
        try {
          var referrerUrl = new URL(document.referrer);
          referrerHost = referrerUrl.hostname;
          
          // Only show if referring domain is different
          if (referrerHost && referrerHost !== currentHost) {
            fromDomain = referrerHost;
          }
        } catch (e) {
          // Invalid referrer URL, ignore
        }
      }

      // Display the redirect notice if we have a source domain
      if (fromDomain) {
        var noticeEl = document.getElementById('redirect-notice');
        var fromEl = document.getElementById('redirect-from');
        if (noticeEl && fromEl) {
          fromEl.textContent = fromDomain;
          noticeEl.style.display = 'block';
        }
      }
    })();
  </script>
</body>
</html>
